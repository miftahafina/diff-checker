<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diff Checker</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #fff; --bg2: #f5f5f5; --bg3: #f0f0f0;
      --fg: #1e1e1e; --fg2: #666; --border: #d4d4d4; --accent: #007acc;
    }
    [data-theme="dark"] {
      --bg: #1e1e1e; --bg2: #252526; --bg3: #2d2d2d;
      --fg: #ccc; --fg2: #999; --border: #3c3c3c; --accent: #4fc1ff;
    }
    html, body { height: 100%; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--fg); overflow: hidden; }
    body { display: flex; flex-direction: column; }
    .toolbar { display: flex; align-items: center; justify-content: space-between; height: 48px; padding: 0 16px; background: var(--bg3); border-bottom: 1px solid var(--border); flex-shrink: 0; }
    .logo { font-size: 16px; font-weight: 600; }
    .toolbar-right { display: flex; gap: 8px; align-items: center; }
    .btn { background: none; border: 1px solid var(--border); border-radius: 4px; padding: 4px 10px; cursor: pointer; font-size: 13px; color: var(--fg); display: flex; align-items: center; }
    .btn:hover { background: var(--bg2); }
    [data-theme="light"] .icon-dark, [data-theme="dark"] .icon-light { display: none; }
    #diff-editor { flex: 1; }
    .footer { display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 16px; flex-shrink: 0; background: var(--bg3); border-top: 1px solid var(--border); font-size: 13px; color: var(--fg2); }
    #lang-select { padding: 4px 8px; border: 1px solid var(--border); border-radius: 4px; background: var(--bg); color: var(--fg); font-size: 13px; outline: none; cursor: pointer; }
    #lang-select:focus { border-color: var(--accent); }
  </style>
</head>
<body>
  <header class="toolbar">
    <h1 class="logo">Diff Checker</h1>
    <div class="toolbar-right">
      <button id="clear-btn" class="btn">Clear</button>
      <button id="theme-toggle" class="btn" title="Toggle theme">
        <svg class="icon-light" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
        <svg class="icon-dark" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
    </div>
  </header>

  <div id="diff-editor"></div>

  <footer class="footer">
    <label for="lang-select">Language</label>
    <select id="lang-select"></select>
  </footer>

  <script type="module" src="/main.js"></script>
</body>
</html>
