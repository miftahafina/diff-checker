<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diff Checker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="toolbar">
    <div class="toolbar-left">
      <h1 class="logo">Diff Checker</h1>
    </div>
    <div class="toolbar-right">
      <div class="control-group">
        <label for="lang-select">Language</label>
        <select id="lang-select"></select>
      </div>
      <div class="control-group">
        <label for="auto-detect">
          <input type="checkbox" id="auto-detect" checked>
          Auto-detect
        </label>
      </div>
      <button id="theme-toggle" class="theme-btn" title="Toggle theme">
        <span class="icon-light">☀️</span>
        <span class="icon-dark">🌙</span>
      </button>
    </div>
  </header>

  <main class="main-container">
    <div class="panel-header">
      <span class="panel-label">Original</span>
      <span class="panel-label">Modified</span>
    </div>
    <div id="diff-editor" class="diff-editor"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs/loader.js"></script>
  <script src="main.js"></script>
</body>
</html>
