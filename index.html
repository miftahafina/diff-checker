<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diff Checker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="toolbar">
    <div class="toolbar-left">
      <h1 class="logo">Diff Checker</h1>
    </div>
    <div class="toolbar-right">
      <button id="clear-btn" class="toolbar-btn" title="Clear all text">Clear</button>
      <button id="theme-toggle" class="toolbar-btn" title="Toggle theme">
        <svg class="icon-light" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5"/>
          <line x1="12" y1="1" x2="12" y2="3"/>
          <line x1="12" y1="21" x2="12" y2="23"/>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
          <line x1="1" y1="12" x2="3" y2="12"/>
          <line x1="21" y1="12" x2="23" y2="12"/>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
        </svg>
        <svg class="icon-dark" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
      </button>
    </div>
  </header>

  <main class="main-container">
    <div class="panel-header">
      <span class="panel-label">Original</span>
      <span class="panel-label">Modified</span>
    </div>
    <div class="mobile-tabs">
      <button class="mobile-tab active" data-tab="before">Before</button>
      <button class="mobile-tab" data-tab="after">After</button>
    </div>
    <div id="diff-editor" class="diff-editor"></div>
  </main>

  <footer class="editor-footer">
    <div class="control-group">
      <label for="lang-select">Language</label>
      <select id="lang-select"></select>
    </div>
    <div class="control-group">
      <label for="auto-detect">
        <input type="checkbox" id="auto-detect" checked>
        Auto-detect
      </label>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs/loader.js"></script>
  <script src="main.js"></script>
</body>
</html>
